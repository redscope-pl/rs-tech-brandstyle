# https://taskfile.dev — entry point of the RedScope Technologies style pack.
# Run through uv (`uv run task <name>`) or any go-task v3 on PATH.

version: '3'

vars:
  # Commits up to this one were made before commitizen was set up.
  COMMITS_FROM: 7ce277f

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install the tools (uv sync) and git hooks (lefthook)
    cmds:
      - uv sync --frozen
      - uv run --frozen lefthook install

  build:
    desc: Build the pack into dist/ (folder + reproducible tarball)
    cmds:
      - uv run --frozen python -I scripts/build.py

  resources:
    desc: Redraw the images made from the masters in resources/ (icons, light/dark logos)
    cmds:
      - uv run --frozen python -I scripts/build.py resources

  check:
    desc: Run every static check (same as CI)
    deps: [check:pack, check:js, check:starters, check:yaml, check:commits]

  check:pack:
    desc: Check tokens, contrast, SVGs, resources/ and two builds of the pack
    cmds:
      - uv run --frozen python -I tests/check.py

  check:js:
    desc: Unit-test the pack's scripts (node --test)
    cmds:
      - node --test 'tests/js/*.test.cjs'

  check:starters:
    desc: Build the Sphinx, Vue, React and Astro starters from a fresh pack (needs npm)
    cmds:
      - uv run --frozen python -I tests/starters.py

  check:yaml:
    desc: Lint YAML files
    cmds:
      - uv run --frozen yamllint --strict .

  check:commits:
    desc: Check that commit messages follow commitizen
    cmds:
      - uv run --frozen cz check --rev-range {{.COMMITS_FROM}}..HEAD

  preview:
    desc: Build, then serve the preview pages (docs/preview.html, preview-nexus.html) on http://localhost:8765
    deps: [build]
    cmds:
      - echo "http://localhost:8765/docs/preview.html  http://localhost:8765/docs/preview-nexus.html  (Ctrl+C stops)"
      - python3 -I -m http.server 8765 --bind 127.0.0.1
