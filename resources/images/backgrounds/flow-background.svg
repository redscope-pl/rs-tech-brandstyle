<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Background of Authentik's flows (branding_default_flow_background):
       the night of the logo, a red glow behind the login box. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#b11020" stop-opacity=".35"/>
      <stop offset="1" stop-color="#b11020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#160100"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
</svg>
