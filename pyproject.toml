[project]
name = "rs-tech-brandstyle"
version = "0.1.0"
description = "The RedScope Technologies style pack: logo, colours, fonts and per-app themes"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.0.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "go-task-bin>=3.54.0",
    "lefthook>=2.2.2",
    "yamllint>=1.38.0",
]

[tool.uv]
package = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
